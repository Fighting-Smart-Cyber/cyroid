<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline so there is no second request and nothing to 404: the file this
         pointed at (/vite.svg) was never in the build. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232563eb' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%232563eb'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The engine's own name, and only until the app mounts: the shell sets
         document.title from src/lib/branding.ts, which a distribution re-themes
         at runtime through GET /api/v1/branding. Editing this to a
         distribution's name is what left one install answering to three
         different product names, so it must keep matching the default in
         branding.ts -- backend/tests/unit/test_branding_is_centralised.py
         fails if the two disagree. -->
    <title>CYROID</title>
  </head>

    <div id="root"></div>
