# Response headers every location must repeat.
#
# nginx's add_header does not accumulate across blocks: a location that adds a
# header of its own discards every add_header inherited from the server block.
# Every location here sets caching headers, so declaring these once at server
# level sent them on exactly nothing -- including the SPA document, which is the
# response they exist for. Repeating them is the only way nginx offers, so they
# live in one file and each location includes it.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
