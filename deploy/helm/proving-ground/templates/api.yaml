apiVersion: v1
kind: Service
metadata:
  name: pg-api
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    {{- include "pg.component" "api" | nindent 4 }}
spec:
  selector:
    {{- include "pg.component" "api" | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-api
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    {{- include "pg.component" "api" | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "pg.component" "api" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pg.component" "api" | nindent 8 }}
      annotations:
        # A new secret value (a regenerated JWT key) must restart the API, or half the pods sign
        # tokens the other half rejects.
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: pg
      {{- include "pg.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "pg.image" (dict "Values" .Values "Chart" .Chart "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # As the Compose stack does: wait for Postgres, migrate, serve. Migrations run here
          # rather than in a Job so a single `helm upgrade` is the whole update.
          command: ["bash", "-c"]
          args:
            - >-
              {{ include "pg.waitForDb" . }} &&
              alembic upgrade head &&
              exec uvicorn proving_ground.main:app --host 0.0.0.0 --port 8000 --workers {{ .Values.api.workers }}
          env:
            {{- include "pg.appEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 15
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 60
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "pg.appVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "pg.appVolumes" . | nindent 8 }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.api.replicas) 1) }}
---
# A node drain evicts the API's pods one at a time instead of all of them, so the console a
# learner has open survives the node under it being emptied. Only at two replicas or more: over a
# single-replica deployment a budget has no safe eviction to allow, so it blocks the drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pg-api
  labels:
    {{- include "pg.labels" . | nindent 4 }}
    {{- include "pg.component" "api" | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "pg.component" "api" | nindent 6 }}
{{- end }}
