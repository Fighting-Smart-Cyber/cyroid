{{- /*
The platform secrets are generated once and then kept: `lookup` reads what is already in the
namespace and an upgrade re-emits it unchanged. Regenerating the JWT secret on every upgrade would
log everyone out; regenerating the database password would lock the API out of its own data.
*/ -}}
{{- /*
An external object store needs the environment's credentials, not ones this chart invented.
Before this, `minio.enabled: false` still wrote a random 12-character access key into
pg-platform and the pods read it, so `--set minio.externalEndpoint=...` produced a deployment
that dialled a real endpoint with a key nobody had ever issued. Refuse at render time, the way
ingress.appsHost and rbac.rangePermissions already do, rather than at the first upload.
*/}}
{{- if not .Values.minio.enabled }}
{{-   if and (not .Values.minio.existingSecret) (not .Values.minio.externalAccessKey) }}
{{-     fail "minio.enabled is false, so the environment supplies the object store -- set minio.existingSecret to a secret holding MINIO_ACCESS_KEY and MINIO_SECRET_KEY (preferred, so the keys never pass through values), or set minio.externalAccessKey and minio.externalSecretKey" }}
{{-   end }}
{{-   if and .Values.minio.externalAccessKey (not .Values.minio.externalSecretKey) }}
{{-     fail "minio.externalAccessKey is set without minio.externalSecretKey" }}
{{-   end }}
{{-   if not .Values.minio.externalEndpoint }}
{{-     fail "minio.enabled is false but minio.externalEndpoint is empty, so there is nowhere to send object storage" }}
{{-   end }}
{{- end }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "pg-platform") }}
{{- $dbPassword := "" }}{{- $minioKey := "" }}{{- $minioSecret := "" }}{{- $jwt := "" }}
{{- /*
The range-application handoff CODE's signing pair. pg-gateway holds only the public half, so a
compromise of the process that terminates untrusted traffic cannot mint a console ticket or an
access token. genSelfSignedCert rather than genPrivateKey: sprig can make a key but cannot emit
the matching public half on its own, and a certificate carries one. utils/app_tokens takes either.

The application TICKET is separate and symmetric. The gateway both mints it (on redeeming a
code) and verifies it (on every later request), so a key it holds only half of cannot work --
0.53.1 signed with the jwt_secret_key fallback and verified with the public key, and every
ticket failed its own check. It gets a secret of its own rather than jwt_secret_key, which
would let the gateway mint a platform access token.
*/}}
{{- $appKey := "" }}{{- $appPub := "" }}{{- $appTicket := "" }}
{{- if $existing }}
{{-   $dbPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{-   $minioKey = index $existing.data "MINIO_ACCESS_KEY" | b64dec }}
{{-   $minioSecret = index $existing.data "MINIO_SECRET_KEY" | b64dec }}
{{-   $jwt = index $existing.data "JWT_SECRET_KEY" | b64dec }}
{{-   $appKey = (index $existing.data "APP_TOKEN_PRIVATE_KEY" | default "") | b64dec }}
{{-   $appPub = (index $existing.data "APP_TOKEN_PUBLIC_KEY" | default "") | b64dec }}
{{-   $appTicket = (index $existing.data "APP_TICKET_SECRET" | default "") | b64dec }}
{{- else }}
{{-   $dbPassword = randAlphaNum 32 }}
{{-   $minioKey = printf "pg-%s" (randAlphaNum 12) }}
{{-   $minioSecret = randAlphaNum 40 }}
{{-   $jwt = randAlphaNum 64 }}
{{- end }}
{{- if not $appKey }}
{{-   $pair := genSelfSignedCert "pg-app-tokens" nil (list "pg-app-tokens") 3650 }}
{{-   $appKey = $pair.Key }}
{{-   $appPub = $pair.Cert }}
{{- end }}
{{- /* Generated on first install and kept by the lookup above, like everything else here: a
     ticket secret that changed on upgrade would sign every learner out of their application. */}}
{{- if not $appTicket }}{{- $appTicket = randAlphaNum 64 }}{{- end }}
{{- /* An operator-supplied key wins over anything generated or remembered. */}}
{{- if and (not .Values.minio.enabled) .Values.minio.externalAccessKey }}
{{-   $minioKey = .Values.minio.externalAccessKey }}
{{-   $minioSecret = .Values.minio.externalSecretKey }}
{{- end }}
{{- $dbUrl := ternary (printf "postgresql://proving_ground:%s@pg-postgres:5432/proving_ground" $dbPassword) .Values.postgres.externalUrl .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: pg-platform
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  DATABASE_URL: {{ $dbUrl | quote }}
  MINIO_ACCESS_KEY: {{ $minioKey | quote }}
  MINIO_SECRET_KEY: {{ $minioSecret | quote }}
  JWT_SECRET_KEY: {{ $jwt | quote }}
  APP_TOKEN_PRIVATE_KEY: {{ $appKey | quote }}
  APP_TOKEN_PUBLIC_KEY: {{ $appPub | quote }}
  APP_TICKET_SECRET: {{ $appTicket | quote }}
{{- /*
The pull secret, and the one rule about it: this chart writes a copy of the registry deploy
token only when there is not already a secret of that name that something else created.

That token pulls every image this install runs, so each place it is written is another place it
can be read from. An installer has to create a pull secret of its own before any release exists
-- it is what Flux authenticates to the chart registry with -- and an install that points
`imagePullSecret` at that one and passes no credentials renders nothing here and keeps one copy
in the cluster rather than three.

Without the ownership check that would not merely be untidy, it would stop the upgrade. Helm
refuses to write over an object it did not create ("exists and cannot be imported into the
current release"), so an install that pointed `imagePullSecret` at the installer's secret while
a stale `registryCredentials` value was still reaching the chart would fail every upgrade from
then on -- and the upgrade path is how an operator gets fixes.

`lookup` returns nothing during `helm template` and during a dry run, so a fresh install always
renders. A secret this release created carries this release's name and is rewritten from values
as before, which is what keeps a rotated token reaching the pods.
*/ -}}
{{- $pullSecretIsForeign := false }}
{{- if .Values.imagePullSecret }}
{{-   $live := (lookup "v1" "Secret" .Release.Namespace .Values.imagePullSecret) }}
{{-   if $live }}
{{-     $annotations := default dict (default dict $live.metadata).annotations }}
{{-     if ne (default "" (index $annotations "meta.helm.sh/release-name")) .Release.Name }}
{{-       $pullSecretIsForeign = true }}
{{-     end }}
{{-   end }}
{{- end }}
{{- if and .Values.registryCredentials.username .Values.registryCredentials.password (not $pullSecretIsForeign) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm, whatever a later chart declares: this is what pulls the next
    # version's images, and losing it mid-upgrade strands the rollout with nothing to pull.
    helm.sh/resource-policy: keep
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict (first (splitList "/" .Values.image.registry)) (dict "username" .Values.registryCredentials.username "password" .Values.registryCredentials.password "auth" (printf "%s:%s" .Values.registryCredentials.username .Values.registryCredentials.password | b64enc))) | toJson | quote }}
{{- end }}
{{- /*
Generated when either host asks for it. An install that brings its own platform certificate
but leaves the applications host on `pg-tls` still needs this rendered, or the applications
Ingress names a secret nothing creates.
*/ -}}
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled (or (eq .Values.ingress.tls.secretName "pg-tls") (eq (include "pg.appsTlsSecretName" .) "pg-tls")) }}
{{- $tls := (lookup "v1" "Secret" .Release.Namespace "pg-tls") }}
{{- $crt := "" }}{{- $key := "" }}
{{- /*
The certificate is worked out once, above the documents that carry it, because it is written to
two places when the default TLSStore is on. genSelfSignedCert called twice returns two different
certificates, and the store and the Ingress would then serve a different one each -- so an
operator who trusted the certificate the browser showed them would meet the other one on the next
host they opened.
*/ -}}
{{- if $tls }}
{{-   $crt = index $tls.data "tls.crt" }}
{{-   $key = index $tls.data "tls.key" }}
{{- else }}
{{- $host := default "proving-ground.local" .Values.ingress.host }}
{{- /*
The names this certificate has to answer for, and the two that are easy to forget. An install
reached by address has no name in the rule at all, so the IP goes in the IP SAN list rather than
the DNS one -- a DNS entry of "10.0.0.1" matches nothing. And every range's applications answer
beneath `ingress.appsHost`, one label each, so the wildcard is what stops the controller falling
back to its own default certificate the moment a learner opens an application.
*/ -}}
{{- $ips := list }}
{{- $dns := list $host "localhost" }}
{{- if regexMatch "^[0-9]+([.][0-9]+){3}$" $host }}{{- $ips = list $host }}{{- $dns = list "localhost" }}{{- end }}
{{- if .Values.ingress.appsHost }}{{- $dns = append $dns (printf "*.%s" .Values.ingress.appsHost) }}{{- end }}
{{- range .Values.ingress.tls.extraNames }}{{- $dns = append $dns (toString .) }}{{- end }}
{{- /*
An address that does not parse is an error and not something to drop. Sprig would fail the render
on it anyway; saying which value is wrong is the difference between a fixable message and a stack
trace, and a SAN silently missing from a certificate is exactly the failure this list exists to
prevent.
*/ -}}
{{- range .Values.ingress.tls.extraIPs }}
{{-   if not (regexMatch "^[0-9]+([.][0-9]+){3}$" (toString .)) }}{{- fail (printf "ingress.tls.extraIPs contains %q, which is not an IPv4 address -- a name belongs in ingress.tls.extraNames" (toString .)) }}{{- end }}
{{-   $ips = append $ips (toString .) }}
{{- end }}
{{- $cert := genSelfSignedCert $host (uniq $ips) (uniq $dns) 3650 }}
{{-   $crt = $cert.Cert | b64enc }}
{{-   $key = $cert.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-tls
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- if and (include "pg.tlsDefaultStore" .) (ne .Values.rangeIngress.controllerNamespace .Release.Namespace) }}
---
# The same certificate, in the ingress controller's namespace, because the TLSStore beside it in
# templates/ingress.yaml can only name a secret of its own namespace. This release does not own
# that namespace: it is written here because there is nowhere else a default certificate can live,
# and it is kept on uninstall like the original, so deleting it is an operator's decision and not
# a side effect of removing the release.
apiVersion: v1
kind: Secret
metadata:
  name: pg-tls
  namespace: {{ .Values.rangeIngress.controllerNamespace }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}
{{- end }}
